div id='notYetList' class='max-h-80 overflow-y-auto text-[11px]'></div></div></div><div id='report2Box' class='p-5 bg-blue-50/30'><h2 class='font-bold text-lg text-blue-700'>Report 2 - SOP</h2><select id='storeSel' class='w-full border-2 p-3 rounded-lg mb-3 font-bold bg-white text-sm'></select><div class='flex gap-2 mb-3'><button id='btnVisit' onclick='setVisit("Visit")' class='flex-1 bg-green-600 text-white p-3 rounded-lg font-bold'>Serviced</button><button id='btnNoVisit' onclick='setVisit("No Visit")' class='flex-1 bg-gray-200 p-3 rounded-lg font-bold'>No Service</button></div><input type='hidden' id='visitStatus' value='Visit'><div id='reasonBox' class='hidden bg-red-50 border-2 border-red-300 p-3 rounded-lg mb-3'><label class='text-sm font-bold text-red-700'>Why No Service? REQUIRED</label><select id='reasonSel' class='w-full border p-2 rounded mt-2 bg-white'><option value=''>Select Reason</option><option>Kedai Tutup</option><option>Owner Tiada</option><option>Tidak Dibenarkan Masuk</option><option>Jalan Banjir</option><option>Masa Tidak Cukup</option><option>Lain-lain</option></select><input id='reasonOther' placeholder='Detailed reason...' class='w-full border p-2 rounded mt-2'></div><div id='visitBox'><div class='grid grid-cols-2 gap-2 mb-3 text-sm'><label class='border bg-white p-2 rounded'><input type='checkbox' class='sop' value='Display'> Display</label><label class='border bg-white p-2 rounded'><input type='checkbox' class='sop' value='Price Tag'> Price Tag</label><label class='border bg-white p-2 rounded'><input type='checkbox' class='sop' value='Clean'> Clean</label><label class='border bg-white p-2 rounded'><input type='checkbox' class='sop' value='Expiry'> Expiry</label></div><input type='file' id='photoInput' multiple accept='image/*' class='w-full border p-2 rounded bg-white mb-2'><div id='preview' class='grid grid-cols-3 gap-2 mb-2'></div></div><textarea id='remarks' placeholder='Remarks...' class='w-full border p-2 rounded h-16 mb-3'></textarea><button onclick='submitData()' id='submitBtn' class='w-full bg-blue-700 text-white p-4 rounded-xl font-bold'>Submit</button><p id='status' class='text-center text-sm mt-2 font-bold'></p></div><div class='p-5 border-t-4 border-black'><h2 class='font-bold text-lg'>Report 1 - OCT Only</h2><div class='grid grid-cols-3 gap-2 my-3'><button onclick='setFilter("all")' class='bg-black text-white p-2 rounded text-xs font-bold'>All 422</button><button onclick='setFilter("Hanni")' class='bg-blue-600 text-white p-2 rounded text-xs'>Hanni 79</button><button onclick='setFilter("Vevian")' class='bg-blue-400 text-white p-2 rounded text-xs'>Vevian 26</button><button onclick='setFilter("Bryan")' class='bg-orange-500 text-white p-2 rounded text-xs'>Bryan 124</button><button onclick='setFilter("Steanly")' class='bg-purple-600 text-white p-2 rounded text-xs'>Steanly 128</button><button onclick='setFilter("Teo")' class='bg-teal-600 text-white p-2 rounded text-xs'>Teo 65</button></div><button onclick='loadData()' class='w-full border-2 p-2 rounded text-sm font-bold mb-3'>Refresh OCT Data</button><div id='reportList' class='space-y-3 text-sm'></div></div></div><script>
function changeRole(){var sel=document.getElementById('roleSel');var raw=sel.value;var roleName=raw.split(' ')[0];if(roleName==='Boss') role='Boss Backstage'; else role=roleName;filterPerson=(role==='Boss Backstage')?'all':role;var count=filterPerson==='all'?BOSS_STORES.length:(STORE_MAP[filterPerson]?STORE_MAP[filterPerson].length:0);var titleText=filterPerson==='all'?'All '+count:filterPerson+' '+count;document.getElementById('trackTitle').innerText=titleText;document.getElementById('cTotal').innerText=count;renderStores();updateTracking();renderList(allData);}
function setFilter(t){var roleName=t.split(' ')[0];if(roleName==='Boss') roleName='Boss Backstage';if(roleName==='Boss Backstage') roleName='all';filterPerson=roleName;role=(roleName==='all')?'Boss Backstage':roleName;var sel=document.getElementById('roleSel');for(var i=0;i<sel.options.length;i++){var optName=sel.options[i].value.split(' ')[0];if(optName===t.split(' ')[0] || (roleName==='all' && sel.options[i].value.indexOf('Boss')>=0)){sel.value=sel.options[i].value; break;}}var count=filterPerson==='all'?BOSS_STORES.length:(STORE_MAP[filterPerson]?STORE_MAP[filterPerson].length:0);var titleText=filterPerson==='all'?'All '+count:filterPerson+' '+count;document.getElementById('trackTitle').innerText=titleText;document.getElementById('cTotal').innerText=count;renderStores();updateTracking();renderList(allData);}
function renderStores(){var sel=document.getElementById('storeSel');sel.innerHTML='';var key=filterPerson==='all'?'Boss Backstage':filterPerson;var list=STORE_MAP[key]||STORE_MAP[role]||BOSS_STORES;if(!list || list.length===0) list=BOSS_STORES;for(var i=0;i<list.length;i++){var o=document.createElement('option');o.value=list[i];o.textContent=list[i];sel.appendChild(o);}} function selectStoreFromNotYet(storeName){var sel=document.getElementById('storeSel');for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===storeName){sel.selectedIndex=i; break;}}document.getElementById('report2Box').scrollIntoView({behavior:'smooth'});document.getElementById('status').innerText='Selected: '+storeName+' - Fill and Submit';}
function setVisit(v){document.getElementById('visitStatus').value=v;document.getElementById('btnVisit').className=v==='Visit'?'flex-1 bg-green-600 text-white p-3 rounded-lg font-bold':'flex-1 bg-gray-200 p-3 rounded-lg font-bold';document.getElementById('btnNoVisit').className=v==='No Visit'?'flex-1 bg-red-600 text-white p-3 rounded-lg font-bold':'flex-1 bg-gray-200 p-3 rounded-lg font-bold';if(v==='No Visit'){document.getElementById('reasonBox').classList.remove('hidden');document.getElementById('visitBox').classList.add('hidden');}else{document.getElementById('reasonBox').classList.add('hidden');document.getElementById('visitBox').classList.remove('hidden');}}
document.getElementById('photoInput').addEventListener('change',function(e){var pre=document.getElementById('preview');pre.innerHTML='';for(var i=0;i<e.target.files.length;i++){(function(file){var r=new FileReader();r.onload=function(ev){var img=document.createElement('img');img.src=ev.target.result;img.className='w-full h-16 object-cover rounded';pre.appendChild(img);};r.readAsDataURL(file);})(e.target.files[i]);}});
function toBase64(f){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.readAsDataURL(f);});}
async function submitData(){var store=document.getElementById('storeSel').value;var visit=document.getElementById('visitStatus').value;var reason=document.getElementById('reasonSel').value+' '+document.getElementById('reasonOther').value;var remarks=document.getElementById('remarks').value;var sops=document.querySelectorAll('.sop:checked');var sopArr=[];for(var i=0;i<sops.length;i++) sopArr.push(sops[i].value);var sop=sopArr.join(',');if(visit==='No Visit'&&!reason.trim()){alert('Must write reason!');return;}var files=document.getElementById('photoInput').files;var btn=document.getElementById('submitBtn');btn.disabled=true;btn.innerText='Uploading...';var imgs=[];for(var i=0;i<files.length;i++) imgs.push(await toBase64(files[i]));var payload={time:new Date().toLocaleString(),store:store,device:role,visit:visit,reason:reason,remarks:remarks+' SOP:'+sop,photos:files.length,images:imgs};try{await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload)});document.getElementById('status').innerText='OK '+store+' - Submitted!';loadData();}catch(e){document.getElementById('status').innerText='Error '+e;}btn.disabled=false;btn.innerText='Submit';}
async function loadData(){var div=document.getElementById('reportList');div.innerHTML='Loading OCT...';try{var res=await fetch(GAS_URL);var data=await res.json();allData=data;renderList(data);updateTracking();}catch(e){div.innerHTML='Failure<br>'+e; updateTracking();}}
function renderList(data){var now=new Date();var curMonth=now.getMonth();var curYear=now.getFullYear();var monthData=data.filter(function(d){if(!d.time) return false; var dt=new Date(d.time); if(isNaN(dt)) return true; return dt.getMonth()===curMonth && dt.getFullYear()===curYear;});var div=document.getElementById('reportList');var filtered=filterPerson==='all'?monthData:monthData.filter(function(d){var dev=(d.device||'').toUpperCase();return dev.indexOf(filterPerson.toUpperCase())>=0;});var html='';for(var i=filtered.length-1;i>=0 && i>=filtered.length-100;i--){var d=filtered[i];var isNo=d.visit&&d.visit.toLowerCase().indexOf('no')>=0;html+='<div class="border p-3 rounded '+(isNo?'bg-red-50 border-red-300':'bg-white')+'"><div class="font-bold">'+d.store+' <span class="'+(isNo?'text-red-600':'text-green-600')+' text-xs">'+d.visit+'</span></div><div class="text-xs text-gray-500">'+d.time+' | '+d.device+'</div>'+(isNo?'<div class="bg-red-100 p-2 rounded mt-1 text-red-700 font-bold text-xs">Reason: '+d.reason+'</div>':'')+'<div class="text-xs mt-1">'+d.remarks+'</div></div>';}div.innerHTML=html;if(filtered.length===0) div.innerHTML='<div class="text-gray-400 text-center p-4 border-2 border-dashed rounded">OCT 还没开单 for '+filterPerson+'<br>All '+ (filterPerson==='all'?BOSS_STORES.length:(STORE_MAP[filterPerson]?STORE_MAP[filterPerson].length:0)) +' 都是 NOT YET</div>';}
function updateTracking(){
var person=filterPerson;var totalStores=person==='all'?BOSS_STORES.length:(STORE_MAP[person]?STORE_MAP[person].length:0);var now=new Date();var curMonth=now.getMonth();var curYear=now.getFullYear();var monthName=now.toLocaleString('default',{month:'long',year:'numeric'});
var monthData=allData.filter(function(d){if(!d.time) return false; var dt=new Date(d.time); if(isNaN(dt)) return true; return dt.getMonth()===curMonth && dt.getFullYear()===curYear;});
document.getElementById('trackDate').innerText='| '+monthName+' Only | SOP:'+monthData.length;
var personData=person==='all'?monthData:monthData.filter(function(d){var dev=(d.device||'').toUpperCase();return dev.indexOf(person.toUpperCase())>=0;});
var visitedMap={};var noServiceMap={};for(var i=0;i<personData.length;i++){var d=personData[i];var v=(d.visit||'').toString().toLowerCase();if(v.indexOf('no')>=0){if(!visitedMap[d.store]){noServiceMap[d.store]=1;}}else{visitedMap[d.store]=1; delete noServiceMap[d.store];}}
var visitedCount=Object.keys(visitedMap).length;var noCount=Object.keys(noServiceMap).length;var notYet=totalStores-visitedCount-noCount;if(notYet<0) notYet=0;
document.getElementById('cTotal').innerText=totalStores;document.getElementById('cServiced').innerText=visitedCount;document.getElementById('cNoService').innerText=noCount;document.getElementById('cNotYet').innerText=notYet;
var progress=totalStores>0?Math.round((visitedCount+noCount)/totalStores*100):0;
document.getElementById('progressText').innerText=progress+'% - '+(visitedCount+noCount)+'/'+totalStores+' in OCT';
document.getElementById('progressBar').style.width=progress+'%';
var allList=person==='all'?BOSS_STORES:(STORE_MAP[person]||[]);var remaining={};for(var i=0;i<allList.length;i++) remaining[allList[i]]=1;
for(var s in visitedMap) delete remaining[s];for(var s in noServiceMap) delete remaining[s];
var notYetList=Object.keys(remaining);document.getElementById('notYetCount').innerText=notYetList.length;var notYetHtml='';
for(var i=0;i<notYetList.length;i++){notYetHtml+='<div onclick="selectStoreFromNotYet(this.getAttribute(\'data-store\'))" data-store="'+notYetList[i].replace(/"/g,'&quot;')+'" style="cursor:pointer;padding:6px;border-bottom:1px solid #eee;" class="hover:bg-yellow-200">'+(i+1)+'. '+notYetList[i]+' <span style="color:blue;font-weight:bold;">[点我填写]</span></div>';}
if(notYetList.length===0) notYetHtml='<div class="text-green-600 font-bold p-2">🎉 All Done in OCT! 100%</div>';
if(notYetList.length>0 && visitedCount===0 && noCount===0){notYetHtml='<div class="bg-yellow-100 p-2 mb-2 font-bold">OCT 还没开单，全部 '+totalStores+' 家未开单，点击直接填：</div>'+notYetHtml;}
document.getElementById('notYetList').innerHTML=notYetHtml;
}
renderStores();updateTracking();loadData();
</script></body></html>
