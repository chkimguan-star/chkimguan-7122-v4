let currentBoss=localStorage.getItem("currentBossV9")||Object.keys(DATA)[0];let reports=JSON.parse(localStorage.getItem("octReportsV9")||"{}");let filtered=[];function init(){const sel=document.getElementById("bossSelect");Object.keys(DATA).forEach(b=>{const o=document.createElement("option");o.value=b;o.text=b+" ("+DATA[b].length+")";if(b===currentBoss)o.selected=true;sel.appendChild(o);});render();}function changeBoss(){currentBoss=document.getElementById("bossSelect").value;localStorage.setItem("currentBossV9",currentBoss);document.getElementById("searchInput").value="";render();}function render(){filtered=DATA[currentBoss]||[];renderList();renderSelect();}function renderList(){let html="";let all=DATA[currentBoss];let allDone=0,allSales=0;all.forEach(s=>{const k=currentBoss+"|"+s.name;const m=reports[k]&&reports[k].type==="Serviced";if(s.isDone||m){allDone++;allSales+=s.oct;}});filtered.forEach((s,i)=>{const k=currentBoss+"|"+s.name;const m=reports[k]&&reports[k].type==="Serviced";const isDone=s.isDone||m;const st=isDone?`<span style="color:green;font-weight:bold">✅ DONE RM${s.oct}</span>`:`<span style="color:blue;cursor:pointer" onclick="quickSelect('${s.name}')">[点我]</span>`;html+=`<div class="shop-item"><span>${i+1}. ${s.name}</span>${st}</div>`;});document.getElementById("shopList").innerHTML=html;document.getElementById("total").innerText=all.length;document.getElementById("serviced").innerText=allDone;document.getElementById("notyet").innerText=all.length-allDone;document.getElementById("progress").innerText=Math.round(allDone/all.length*100)+"%";document.getElementById("sales").innerText=allSales.toFixed(2);}function renderSelect(){const sel=document.getElementById("shopSelect");sel.innerHTML="";filtered.forEach(s=>{const o=document.createElement("option");o.value=s.name;const k=currentBoss+"|"+s.name;const m=reports[k]&&reports[k].type==="Serviced";const isDone=s.isDone||m;o.text=(isDone?"✅ ":"")+s.name+(s.oct>0?" - RM"+s.oct:"");sel.appendChild(o);});}function filterShops(){const q=document.getElementById("searchInput").value.toLowerCase();const all=DATA[currentBoss]||[];filtered=q?all.filter(s=>s.name.toLowerCase().includes(q)):all;renderList();renderSelect();}function quickSelect(n){document.getElementById("searchInput").value=n;filterShops();document.getElementById("shopSelect").value=n;}function submitReport(t){const shop=document.getElementById("shopSelect").value;if(!shop){alert("请选择");return}const k=currentBoss+"|"+shop;reports[k]={type:t,time:new Date().toISOString()};localStorage.setItem("octReportsV9",JSON.stringify(reports));document.getElementById("msg").innerText=shop+" ✅ "+t;renderList();renderSelect();}init();</script></body></html>
